<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Magic Survive · 게임 화면 목업</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="game.css"><link rel="stylesheet" href="unified.css"></head>
